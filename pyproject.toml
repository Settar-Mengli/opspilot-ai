[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Local rule-based AI operations command center vertical slice"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "OpsPilot AI Contributors" }]
dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"anthropic>=0.25.0",
	"python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"httpx",
	"pytest-socket>=0.7.0",
	"pytest-cov>=5.0",
	"pytest-randomly>=3.15",
	"ruff>=0.9",
	"mypy>=1.14",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opspilot*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost"

[tool.coverage.run]
source = ["opspilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["opspilot"]
warn_unused_ignores = true

# Legacy adapters: relaxed until B2 migrates them (A8). New B1 code stays strict.
[[tool.mypy.overrides]]
module = [
	"opspilot.adapters.claude_adapter",
	"opspilot.adapters.conversation_adapter",
	"opspilot.adapters.evening_adapter",
	"opspilot.adapters.insights_adapter",
	"opspilot.adapters.briefing_adapter",
	"opspilot.adapters.factory",
	"opspilot.adapters.rule_based",
	"opspilot.adapters.base",
]
strict = false
disallow_untyped_defs = false
check_untyped_defs = false
