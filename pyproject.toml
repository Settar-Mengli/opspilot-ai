[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Local rule-based AI operations command center vertical slice"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpsPilot AI Contributors" }]
dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"anthropic>=0.25.0",
	"python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"httpx",
	"pytest-socket>=0.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opspilot*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost"
