[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Local rule-based AI operations command center vertical slice"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "OpsPilot AI Contributors" }]
dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"anthropic>=0.25.0",
	"python-dotenv>=1.0.0",
	"sqlalchemy>=2.0",
	"psycopg[binary]>=3.3.6",
	"alembic>=1.20.0",
]

# PEP 735: plain `uv sync` installs the default dependency group (dev).
[dependency-groups]
dev = [
	"pytest>=8.0",
	"httpx",
	"pytest-socket>=0.7.0",
	"pytest-cov>=5.0",
	"pytest-randomly>=3.15",
	"ruff>=0.9",
	"mypy>=1.14",
	"pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opspilot*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost"
markers = [
	"alembic: alembic upgrade/downgrade round-trip against throwaway DB",
]

[tool.coverage.run]
source = ["opspilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 72

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["opspilot"]
warn_unused_ignores = true

# Legacy modules: relaxed until B2 (A8). Explicit list — no blanket repo ignore.
[[tool.mypy.overrides]]
module = [
	"opspilot.adapters.claude_adapter",
	"opspilot.adapters.conversation_adapter",
	"opspilot.adapters.evening_adapter",
	"opspilot.adapters.insights_adapter",
	"opspilot.adapters.briefing_adapter",
	"opspilot.adapters.factory",
	"opspilot.adapters.rule_based",
	"opspilot.adapters.base",
	"opspilot.ingest.*",
	"opspilot.nlp.*",
	"opspilot.history.*",
	"opspilot.rules.*",
	"opspilot.cli",
	"opspilot.config.*",
	"opspilot.capabilities.*",
	"opspilot.utils.*",
	"opspilot.pipeline.*",
	"opspilot.models.*",
]
ignore_errors = true
