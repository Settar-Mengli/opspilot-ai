[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Local rule-based AI operations command center vertical slice"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpsPilot AI Contributors" }]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"fastapi",
	"uvicorn[standard]",
	"httpx2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opspilot*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
