name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1 (pinned + SHA256)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o "${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSL -o checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          EXPECTED=$(awk -v f="${ARCHIVE}" '$2 == f { print $1 }' checksums.txt)
          test -n "${EXPECTED}"
          test "${EXPECTED}" = "${GITLEAKS_LINUX_X64_SHA256}"
          echo "${EXPECTED}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot_test
      OPSPILOT_FORCE_RULES: "1"
      ANTHROPIC_API_KEY: sk-ant-test-fake
      OPSPILOT_AI_API_KEY: sk-ant-test-fake

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/opspilot

      - name: pip-audit (production deps)
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/opspilot-req.txt
          uv run pip-audit -r /tmp/opspilot-req.txt

      - name: Run backend test suite (random order + coverage)
        run: |
          echo "pytest-randomly seed=${{ github.run_id }}"
          uv run pytest -q --randomly-seed=${{ github.run_id }} --cov=opspilot --cov-fail-under=72

      - name: Set up Node.js (OpenAPI types)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: OpenAPI schema + generated types drift
        run: |
          uv run python scripts/export_openapi.py
          cd frontend
          npm ci
          npx openapi-typescript ./openapi.json -o src/api/generated.ts
          cd ..
          git diff --exit-code -- frontend/openapi.json frontend/src/api/generated.ts

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
