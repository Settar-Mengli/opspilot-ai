# UI Baselines (GHA sole visual authority)

# Modes: update | compare
# Push to visual/** reads .github/visual-run.json; workflow_dispatch uses inputs.

name: UI Baselines

on:
  workflow_dispatch:
    inputs:
      mode:
        description: update or compare
        type: choice
        options: [update, compare]
        required: true
      frontend_ref:
        description: git ref for UI source (src / index.html / public)
        type: string
        required: true
      harness_ref:
        description: git ref for e2e / playwright harness
        type: string
        required: true
      artifact_name:
        description: artifact name prefix
        type: string
        required: true
      before_artifact_run_id:
        description: prior run id (compare mode)
        type: string
        required: false
      before_artifact_name:
        description: prior artifact name (compare mode)
        type: string
        required: false
  push:
    branches: ["visual/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Baselines
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    env:
      CI: "true"
      # Avoid interactive prompts inside the container
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout trigger ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Mark repo safe for container git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve visual-run config
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            FRONTEND_REF="${{ inputs.frontend_ref }}"
            HARNESS_REF="${{ inputs.harness_ref }}"
            ARTIFACT_NAME="${{ inputs.artifact_name }}"
            BEFORE_RUN_ID="${{ inputs.before_artifact_run_id }}"
            BEFORE_NAME="${{ inputs.before_artifact_name }}"
          else
            CFG=".github/visual-run.json"
            if [ ! -f "$CFG" ]; then
              echo "Missing $CFG on visual/* push" >&2
              exit 1
            fi
            MODE=$(python3 -c "import json;print(json.load(open('$CFG'))['mode'])")
            FRONTEND_REF=$(python3 -c "import json;print(json.load(open('$CFG'))['frontend_ref'])")
            HARNESS_REF=$(python3 -c "import json;print(json.load(open('$CFG'))['harness_ref'])")
            ARTIFACT_NAME=$(python3 -c "import json;print(json.load(open('$CFG'))['artifact_name'])")
            BEFORE_RUN_ID=$(python3 -c "import json;d=json.load(open('$CFG'));print(d.get('before_artifact_run_id') or '')")
            BEFORE_NAME=$(python3 -c "import json;d=json.load(open('$CFG'));print(d.get('before_artifact_name') or '')")
          fi
          case "$MODE" in update|compare) ;; *) echo "Invalid mode: $MODE" >&2; exit 1 ;; esac
          if [ -z "$FRONTEND_REF" ] || [ -z "$HARNESS_REF" ] || [ -z "$ARTIFACT_NAME" ]; then
            echo "frontend_ref, harness_ref, artifact_name required" >&2
            exit 1
          fi
          if [ "$MODE" = "compare" ]; then
            if [ -z "$BEFORE_RUN_ID" ] || [ -z "$BEFORE_NAME" ]; then
              echo "compare mode requires before_artifact_run_id and before_artifact_name" >&2
              exit 1
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=$FRONTEND_REF" >> "$GITHUB_OUTPUT"
          echo "harness_ref=$HARNESS_REF" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "before_run_id=$BEFORE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "before_name=$BEFORE_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE frontend=$FRONTEND_REF harness=$HARNESS_REF artifact=$ARTIFACT_NAME"

      - name: Materialize harness + frontend substitution
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="${{ steps.cfg.outputs.harness_ref }}"
          FRONTEND="${{ steps.cfg.outputs.frontend_ref }}"
          git fetch origin "$HARNESS" "$FRONTEND" || git fetch --all
          # Prefer remote refs
          if git rev-parse --verify "origin/$HARNESS" >/dev/null 2>&1; then
            HARNESS_REV="origin/$HARNESS"
          else
            HARNESS_REV="$HARNESS"
          fi
          if git rev-parse --verify "origin/$FRONTEND" >/dev/null 2>&1; then
            FRONTEND_REV="origin/$FRONTEND"
          else
            FRONTEND_REV="$FRONTEND"
          fi
          git checkout -f "$HARNESS_REV"
          git checkout "$FRONTEND_REV" -- frontend/src frontend/index.html frontend/public
          git checkout "$HARNESS_REV" -- frontend/e2e frontend/playwright.config.ts frontend/package.json frontend/package-lock.json
          # Before-run leak check: c5de149 must be monolith CSS
          if [ "$FRONTEND" = "c5de149" ] || [[ "$FRONTEND" == c5de149* ]]; then
            if [ -d frontend/src/styles ]; then
              echo "LEAK: frontend/src/styles present after c5de149 substitution" >&2
              exit 1
            fi
            if [ ! -f frontend/src/index.css ]; then
              echo "Expected monolith frontend/src/index.css from c5de149" >&2
              exit 1
            fi
          fi
          # Keep gallery script from trigger commit if present on current checkout history
          git checkout "${{ github.sha }}" -- scripts/visual_gallery.mjs 2>/dev/null || true
          if [ ! -f scripts/visual_gallery.mjs ]; then
            # Fall back: already on harness which may lack script; fetch from PR branch tip via SHA parents
            echo "visual_gallery.mjs missing after materialize" >&2
            ls -la scripts || true
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download before baselines (compare)
        if: steps.cfg.outputs.mode == 'compare'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.cfg.outputs.before_name }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.cfg.outputs.before_run_id }}"
          mkdir -p /tmp/before-artifact
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "$API" -o /tmp/artifacts.json
          python3 <<'PY'
          import json, os, sys
          data = json.load(open("/tmp/artifacts.json"))
          name = os.environ["NAME"]
          arts = [a for a in data.get("artifacts", []) if a["name"] == name and not a.get("expired")]
          if not arts:
              print(f"Artifact {name!r} not found for run", file=sys.stderr)
              sys.exit(1)
          open("/tmp/art-url.txt", "w").write(arts[0]["archive_download_url"])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "$(cat /tmp/art-url.txt)" -o /tmp/before.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/before.zip').extractall('/tmp/before-artifact')"
          SRC=$(find /tmp/before-artifact -type d -name 'visual.spec.ts-snapshots' | head -n1 || true)
          if [ -z "$SRC" ]; then
            SRC=$(find /tmp/before-artifact -type d -name 'snapshots' | head -n1 || true)
          fi
          if [ -z "$SRC" ]; then SRC=/tmp/before-artifact; fi
          mkdir -p frontend/e2e/visual.spec.ts-snapshots
          find "$SRC" -name '*.png' -exec cp -f {} frontend/e2e/visual.spec.ts-snapshots/ \;
          echo "Copied before PNGs: $(ls frontend/e2e/visual.spec.ts-snapshots | wc -l)"

      - name: Run Playwright (update or compare)
        id: pw
        working-directory: frontend
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/pw-report.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results playwright-report
          EXTRA=()
          if [ "${{ steps.cfg.outputs.mode }}" = "update" ]; then
            EXTRA+=(--update-snapshots)
          fi
          # Pixel failures must not fail the job; continue-on-error handles non-zero exit.
          # Built-in reporters do not accept path-after-colon; use PLAYWRIGHT_JSON_OUTPUT_FILE.
          npx playwright test e2e/visual.spec.ts "${EXTRA[@]}" \
            --reporter=line \
            --reporter=json \
            --reporter=html

      - name: Gallery index + render gate
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.cfg.outputs.mode }}"
          REPORT=/tmp/pw-report.json
          if [ ! -f "$REPORT" ]; then
            # fallback search
            REPORT=$(find frontend -name 'report.json' -o -name 'pw-report.json' 2>/dev/null | head -n1 || true)
          fi
          if [ ! -f "$REPORT" ]; then
            echo "No Playwright JSON report found" >&2
            exit 1
          fi
          node scripts/visual_gallery.mjs index "$REPORT" gallery.md --new-states=dashboard-error,evening-error
          if [ "$MODE" = "update" ] && { [ "${{ steps.cfg.outputs.frontend_ref }}" = "c5de149" ] || [[ "${{ steps.cfg.outputs.frontend_ref }}" == c5de149* ]]; }; then
            node scripts/visual_gallery.mjs render-gate "$REPORT" --new-states=dashboard-error,evening-error
          elif [ "$MODE" = "update" ]; then
            # Non-c5de149 update: any render failure blocks
            node scripts/visual_gallery.mjs render-gate "$REPORT" --new-states=
          fi
          # compare mode: pixel diffs OK; render failures for existing states still block
          if [ "$MODE" = "compare" ]; then
            node scripts/visual_gallery.mjs render-gate "$REPORT" --new-states=dashboard-error,evening-error
          fi

      - name: Stage snapshots for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/snapshots
          if [ -d frontend/e2e/visual.spec.ts-snapshots ]; then
            cp -a frontend/e2e/visual.spec.ts-snapshots/. artifacts/snapshots/
          fi
          mkdir -p artifacts/playwright-report artifacts/test-results
          if [ -d frontend/playwright-report ]; then cp -a frontend/playwright-report/. artifacts/playwright-report/; fi
          if [ -d frontend/test-results ]; then cp -a frontend/test-results/. artifacts/test-results/; fi
          if [ -f gallery.md ]; then cp gallery.md artifacts/gallery.md; fi
          if [ -f /tmp/pw-report.json ]; then cp /tmp/pw-report.json artifacts/pw-report.json; fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.cfg.outputs.artifact_name }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
