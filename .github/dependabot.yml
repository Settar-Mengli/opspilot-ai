version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "playwright"
      - dependency-name: "@playwright/test"
      # Baseline-affecting / U9 batch — do not auto-bump until owner U9 refresh
      - dependency-name: "lucide-react"
      - dependency-name: "vitest"
        versions: [">=5"]
    groups:
      frontend-dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "playwright"
          - "@playwright/test"
      frontend-prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
      playwright:
        applies-to: version-updates
        patterns:
          - "playwright"
          - "@playwright/test"
      playwright-security:
        applies-to: security-updates
        patterns:
          - "playwright"
          - "@playwright/test"
    # Majors and other security updates: ungrouped individual PRs (no catch-all security group).

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Action majors remain ungrouped.
